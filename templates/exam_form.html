{% extends "base.html" %}

{% block title %}Examination{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <h3 class="mb-3">{{ "Edit Examination" if exam else "Add Examination" }}</h3>

                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Course</label>
                            <select name="course_id" class="form-select" required>
                                {% for course in courses %}
                                <option value="{{ course.id }}" {% if exam and exam.course_id == course.id %}selected{% endif %}>
                                    {{ course.course_code }} - {{ course.course_name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Examination Name</label>
                            <input type="text" name="exam_name" class="form-control" value="{{ exam.exam_name if exam }}" required>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Type</label>
                            <select name="exam_type" class="form-select">
                                {% for t in ExamType %}
                                <option value="{{ t.name }}" {% if exam and exam.exam_type == t %}selected{% endif %}>{{ t.value }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Duration (minutes)</label>
                            <input type="number" name="duration_minutes" class="form-control" min="1" value="{{ exam.duration_minutes if exam }}" required>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Maximum Marks</label>
                            <input type="number" name="max_marks" class="form-control" min="1" value="{{ exam.max_marks if exam }}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Slot Creation Start</label>
                            <input type="date" name="slot_creation_start" class="form-control" value="{{ exam.slot_creation_start.isoformat() if exam }}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Slot Creation End</label>
                            <input type="date" name="slot_creation_end" class="form-control" value="{{ exam.slot_creation_end.isoformat() if exam }}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Booking Start</label>
                            <input type="date" name="booking_start" class="form-control" value="{{ exam.booking_start.isoformat() if exam }}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Booking End</label>
                            <input type="date" name="booking_end" class="form-control" value="{{ exam.booking_end.isoformat() if exam }}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Assigned Examiner</label>
                            <select name="examiner_id" class="form-select">
                                <option value="">Not assigned</option>
                                {% for examiner in examiners %}
                                <option value="{{ examiner.id }}" {% if exam and exam.examiner_id == examiner.id %}selected{% endif %}>
                                    {{ examiner.name }} ({{ examiner.examiner_profile.department if examiner.examiner_profile }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Back</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
