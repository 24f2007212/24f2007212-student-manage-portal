{% extends "base.html" %}

{% block title %}Edit Slot{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h3 class="mb-3">Edit Slot</h3>
                <p class="text-muted">{{ slot.examination.exam_name }}</p>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="slot_date" class="form-control" min="{{ slot.examination.booking_start.isoformat() }}" value="{{ slot.slot_date.isoformat() }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Start Time</label>
                        <input type="time" name="start_time" class="form-control" value="{{ slot.start_time.strftime('%H:%M') }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">End Time</label>
                        <input type="time" name="end_time" class="form-control" value="{{ slot.end_time.strftime('%H:%M') }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Capacity</label>
                        <input type="number" name="capacity" class="form-control" min="1" value="{{ slot.capacity }}" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="{{ url_for('examiner_slots', exam_id=slot.exam_id) }}" class="btn btn-secondary">Back</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
