{% extends "base.html" %}

{% block title %}Edit Rubric{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h3 class="mb-3">Edit Rubric</h3>
                <p class="text-muted">{{ exam.exam_name }} (max marks {{ exam.max_marks }})</p>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Criterion Name</label>
                        <input type="text" name="criterion_name" class="form-control" value="{{ rubric.criterion_name }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Maximum Marks</label>
                        <input type="number" name="max_marks" class="form-control" min="1" value="{{ rubric.max_marks }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Weightage</label>
                        <input type="number" name="weightage" class="form-control" min="0.1" step="0.1" value="{{ rubric.weightage }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control">{{ rubric.description or "" }}</textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="{{ url_for('exam_detail', exam_id=exam.id) }}" class="btn btn-secondary">Back</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
